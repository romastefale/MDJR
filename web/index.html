<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f3f1" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141416" />
    <title>Math DJ Robot</title>
    <meta name="description" content="Sintetizador matemático." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        var d = document.documentElement, t;
        try { t = localStorage.getItem("lg-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        d.setAttribute("data-theme", t);
        d.style.colorScheme = t;
        var c = t === "dark" ? "#141416" : "#f4f3f1";
        var m = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < m.length; i++) m[i].setAttribute("content", c);
      })();
    </script>
    <style>html,body{margin:0;height:100%;overflow:hidden}body{background:#f4f3f1}html[data-theme=dark] body{background:#141416}</style>
    <link rel="stylesheet" href="./desk.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <main id="app" class="dj-root"></main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
